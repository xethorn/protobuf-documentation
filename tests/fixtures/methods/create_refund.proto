// Represents request and response messages for creating a new payment refund.
// Includes idempotency key strings to guarantee safe retry behavior across network timeouts.
syntax = "proto3";

package payments.core;

import "tests/fixtures/resources/refund.proto";

// Represents request payload to create a new payment refund resource.
// Includes client idempotency keys to guarantee at-most-once execution semantics.
message CreateRefundRequest {
  // Represents unique idempotency key string generated by client for retry protection.
  // Must be a unique UUID or hash string per distinct business intent.
  string idempotency_key = 1;

  // Represents input PaymentRefund payload attributes specifying payment ID and amount.
  // Contains required payment ID, monetary refund amount, and reason strings.
  PaymentRefund refund = 2;
}

// Represents response payload containing created refund resource details.
// Confirms created refund state or returns error items if processing failed.
message CreateRefundResponse {
  // Represents list of error items describing validation or processing failures.
  // Populated when card networks reject transaction or validation fails.
  repeated ServiceError errors = 1;

  // Represents created PaymentRefund resource reflecting persisted state.
  // Contains system-generated ID and initialized processing status code.
  PaymentRefund refund = 2;
}
