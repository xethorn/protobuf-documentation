// Options file for payment testing
syntax = "proto3";

package square.options;

import "google/protobuf/descriptor.proto";

// Custom extension option for methods to mark deprecation or experimental status
extend google.protobuf.MethodOptions {
  // Description comment for experimental extension
  bool is_experimental = 50001;
}

// Custom extension option for fields
extend google.protobuf.FieldOptions {
  // Sensitive field flag comment
  bool is_sensitive = 50002;
}
