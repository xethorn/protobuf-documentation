// Represents Payment Refunds Service API definition.
syntax = "proto3";

package square.payments;

import "tests/fixtures/methods/retrieve_refund.proto";
import "tests/fixtures/methods/query_refunds.proto";
import "tests/fixtures/methods/create_refund.proto";
import "tests/fixtures/methods/update_refund.proto";
import "tests/fixtures/methods/delete_refund.proto";

// Represents service managing payment refund operations.
service RefundsService {
  // Represents method to retrieve a payment refund by ID.
  rpc RetrieveRefund(RetrieveRefundRequest) returns (RetrieveRefundResponse);

  // Represents method to query payment refunds based on filter criteria.
  rpc QueryRefunds(QueryRefundsRequest) returns (QueryRefundsResponse);

  // Represents method to create a new payment refund.
  rpc CreateRefund(CreateRefundRequest) returns (CreateRefundResponse);

  // Represents method to update an existing payment refund.
  rpc UpdateRefund(UpdateRefundRequest) returns (UpdateRefundResponse);

  // Represents method to delete a payment refund by ID.
  rpc DeleteRefund(DeleteRefundRequest) returns (DeleteRefundResponse);
}
